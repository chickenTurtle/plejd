name: Release

# Builds the add-on image and publishes it to ghcr.io/chickenturtle/plejd:<version>.
# Home Assistant pulls the tag matching "version" in plejd/config.json, so the
# release tag must equal that version (a leading "v" is allowed).

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/chickenturtle/plejd

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches add-on version
        id: version
        run: |
          version=$(jq -r .version plejd/config.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match plejd/config.json version '$version'"
            exit 1
          fi
          if docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$version already exists; bump the version in plejd/config.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.type=addon
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
